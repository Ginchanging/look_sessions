<!DOCTYPE html>
<html lang="zh-CN" data-skin="terminal" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 对话阅读器</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ═══════════════════════════════════════════════════════════════════════════
   设计令牌 — 两轴主题：data-skin(terminal|editorial) × data-theme(light|dark)
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  /* 兜底 = 终端暗色（首屏脚本会即时写入正确属性） */
  --radius: 8px;
  --font: 'SF Mono', ui-monospace, Menlo, Monaco, 'Cascadia Code', Consolas, 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;
  --mono: 'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace;
  --heading-font: var(--font);
  --bg: #0b0f0d; --bg-grid: rgba(74,240,122,0.035);
  --surface: #0e130f; --surface-2: #11160f; --user-surface: #0f1710;
  --border: #1c271a; --border-strong: #2a3a26;
  --text: #cdd6c8; --text-dim: #7e8c77; --text-faint: #515c4c;
  --accent: #4af07a; --accent-bright: #7ef9a3; --accent-soft: rgba(74,240,122,0.12);
  --info: #56d4dd; --warn: #e3b341;
  --code-bg: #070a08; --code-text: #c4e8cf;
  --glow: 0 0 6px rgba(74,240,122,0.45);
  --selection: rgba(74,240,122,0.28);
  --shadow: 0 6px 24px rgba(0,0,0,0.55);
}

/* ── 字体 / 结构（按皮肤） ── */
[data-skin="terminal"] {
  --font: 'SF Mono', ui-monospace, Menlo, Monaco, 'Cascadia Code', Consolas, 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;
  --heading-font: var(--font);
  --radius: 8px;
}
[data-skin="editorial"] {
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
  --heading-font: 'New York', ui-serif, Georgia, 'Songti SC', 'STSong', 'Times New Roman', serif;
  --radius: 4px;
}

/* ── 调色板：terminal × dark（主打） ── */
[data-skin="terminal"][data-theme="dark"] {
  --bg: #0b0f0d; --bg-grid: rgba(74,240,122,0.035);
  --surface: #0e130f; --surface-2: #11160f; --user-surface: #0f1710;
  --border: #1c271a; --border-strong: #2a3a26;
  --text: #cdd6c8; --text-dim: #7e8c77; --text-faint: #515c4c;
  --accent: #4af07a; --accent-bright: #7ef9a3; --accent-soft: rgba(74,240,122,0.12);
  --info: #56d4dd; --warn: #e3b341;
  --code-bg: #070a08; --code-text: #c4e8cf;
  --glow: 0 0 6px rgba(74,240,122,0.45);
  --selection: rgba(74,240,122,0.28);
  --shadow: 0 6px 24px rgba(0,0,0,0.55);
}
/* ── terminal × light（纸质终端） ── */
[data-skin="terminal"][data-theme="light"] {
  --bg: #e9ece2; --bg-grid: rgba(20,80,40,0.045);
  --surface: #f3f5ec; --surface-2: #eaeee1; --user-surface: #e4efe0;
  --border: #c9d2bf; --border-strong: #aebba2;
  --text: #1e2a1c; --text-dim: #57674f; --text-faint: #8a9882;
  --accent: #1f8f47; --accent-bright: #157a3a; --accent-soft: rgba(31,143,71,0.12);
  --info: #117a86; --warn: #8a5e0f;
  --code-bg: #15201a; --code-text: #cfe8d6;
  --glow: none;
  --selection: rgba(31,143,71,0.22);
  --shadow: 0 4px 16px rgba(40,60,40,0.12);
}
/* ── editorial × light（暖纸杂志，主打） ── */
[data-skin="editorial"][data-theme="light"] {
  --bg: #f5f2ea; --bg-grid: transparent;
  --surface: #fbf9f3; --surface-2: #efeadf; --user-surface: #efe9db;
  --border: #e2dac9; --border-strong: #cabfa8;
  --text: #1c1a17; --text-dim: #6b6357; --text-faint: #9c9384;
  --accent: #b4532a; --accent-bright: #a3491f; --accent-soft: rgba(180,83,42,0.10);
  --info: #2f6f6b; --warn: #9a6b12;
  --code-bg: #2a2620; --code-text: #e8e1d2;
  --glow: none;
  --selection: rgba(180,83,42,0.18);
  --shadow: 0 8px 30px rgba(60,50,35,0.10);
}
/* ── editorial × dark（墨色 ink） ── */
[data-skin="editorial"][data-theme="dark"] {
  --bg: #17150f; --bg-grid: transparent;
  --surface: #1e1b14; --surface-2: #241f17; --user-surface: #221d14;
  --border: #322c20; --border-strong: #443c2c;
  --text: #e8e3d6; --text-dim: #a39a86; --text-faint: #6f6857;
  --accent: #e0844f; --accent-bright: #ec9968; --accent-soft: rgba(224,132,79,0.12);
  --info: #6fb3ad; --warn: #d8b25a;
  --code-bg: #110f0a; --code-text: #e6dcc8;
  --glow: none;
  --selection: rgba(224,132,79,0.22);
  --shadow: 0 8px 30px rgba(0,0,0,0.5);
}

/* ═══ 全局 ═══ */
html { color-scheme: light dark; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  color: var(--text);
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 30px 30px;
  min-height: 100vh;
  transition: background-color 0.35s ease, color 0.35s ease;
}
::selection { background: var(--selection); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

/* ═══ CRT 扫描线覆盖层（仅 terminal + dark） ═══ */
#crt { display: none; }
[data-skin="terminal"][data-theme="dark"] #crt {
  display: block;
  position: fixed; inset: 0; z-index: 500; pointer-events: none;
  background: repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.16) 2px 3px);
  box-shadow: inset 0 0 200px rgba(0,0,0,0.6);
  animation: crtflicker 7s steps(1) infinite;
}
@keyframes crtflicker { 0%,95%,100% { opacity: 1; } 96% { opacity: 0.9; } 97% { opacity: 0.98; } 98% { opacity: 0.92; } }

/* ═══ 顶栏 ═══ */
#header {
  position: sticky; top: 0; z-index: 100;
  display: none; align-items: center; gap: 12px;
  padding: 11px 22px;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
#header-title {
  font-family: var(--heading-font);
  font-weight: 600; font-size: 15px; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
[data-skin="terminal"] #header-title::before { content: "▍"; color: var(--accent); margin-right: 7px; text-shadow: var(--glow); }
[data-skin="editorial"] #header-title { font-weight: 700; letter-spacing: 0.01em; }
#header-meta { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); white-space: nowrap; }
#header-copy, #header-reset {
  font-family: var(--mono);
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-dim);
  border-radius: var(--radius);
  padding: 4px 11px; font-size: 12px; cursor: pointer; white-space: nowrap;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
#header-copy:hover, #header-reset:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
[data-skin="terminal"] #header-copy::before, [data-skin="terminal"] #header-reset::before { content: "["; color: var(--text-faint); }
[data-skin="terminal"] #header-copy::after, [data-skin="terminal"] #header-reset::after { content: "]"; color: var(--text-faint); }

/* ═══ 落地页 ═══ */
#dropzone-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px; }
#dropzone {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  max-width: 520px; width: 100%;
  cursor: pointer; overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
}
#dropzone:hover { transform: translateY(-2px); }
#dropzone.dragover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
#dropzone-bar {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  background: var(--surface-2); font-family: var(--mono); font-size: 11px; color: var(--text-faint);
}
#dropzone-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--border-strong); }
[data-skin="terminal"][data-theme="dark"] #dropzone-bar i:nth-child(1) { background: #ff5f56; }
[data-skin="terminal"][data-theme="dark"] #dropzone-bar i:nth-child(2) { background: #ffbd2e; }
[data-skin="terminal"][data-theme="dark"] #dropzone-bar i:nth-child(3) { background: #27c93f; }
#dropzone-bar b { margin-left: 6px; font-weight: normal; }
[data-skin="editorial"] #dropzone-bar { display: none; }
#dropzone-body { padding: 50px 56px; text-align: center; }
[data-skin="editorial"] #dropzone-body { padding: 66px 56px; }
#dropzone h2 { font-family: var(--heading-font); font-size: 26px; color: var(--text); margin-bottom: 10px; }
[data-skin="terminal"] #dropzone h2::after { content: "_"; color: var(--accent); animation: blink 1.1s steps(1) infinite; }
[data-skin="editorial"] #dropzone h2 { font-size: 34px; font-weight: 700; }
[data-skin="editorial"] #dropzone h2::after { content: ""; display: block; width: 46px; height: 2px; background: var(--accent); margin: 16px auto 0; }
@keyframes blink { 50% { opacity: 0; } }
#dropzone p { font-family: var(--mono); color: var(--text-dim); font-size: 13px; margin-bottom: 22px; line-height: 1.7; }
[data-skin="editorial"] #dropzone p { font-family: var(--font); }
#file-input { display: none; }
#dropzone label {
  display: inline-block; font-family: var(--mono);
  background: var(--accent); color: var(--bg);
  border-radius: var(--radius); padding: 9px 22px; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: filter 0.15s, transform 0.1s;
}
#dropzone label:hover { filter: brightness(1.12); }
#dropzone label:active { transform: translateY(1px); }
[data-skin="terminal"] #dropzone label::before { content: "▸ "; }
#drop-hint { font-family: var(--mono); font-size: 12px; color: var(--text-faint); margin-top: 14px; }

/* ═══ 对话区 ═══ */
#chat-container { display: none; max-width: 820px; margin: 0 auto; padding: 28px 20px 96px; }
[data-skin="editorial"] #chat-container { max-width: 720px; }

.turn { display: flex; margin: 18px 0; }
.turn-user { justify-content: flex-end; }
.turn-assistant { justify-content: flex-start; }
.bubble {
  position: relative;
  max-width: 84%;
  padding: 12px 16px;
  border-radius: var(--radius);
  word-break: break-word; overflow-wrap: break-word;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  animation: turn-in 0.4s ease both;
}
.turn-user .bubble { background: var(--user-surface); border-color: var(--border-strong); }
@keyframes turn-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* editorial：转录式全宽、少边框 */
[data-skin="editorial"] .turn { margin: 30px 0; }
[data-skin="editorial"] .turn-user, [data-skin="editorial"] .turn-assistant { justify-content: flex-start; }
[data-skin="editorial"] .bubble { max-width: 100%; background: transparent; border: none; border-radius: 0; padding: 2px 0 6px; }
[data-skin="editorial"] .turn-user .bubble { background: transparent; border-left: 2px solid var(--accent); padding-left: 18px; }

/* 角色 / 元信息行 */
.turn-meta { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
.role-name { font-weight: 600; color: var(--text-dim); }
.turn-user .role-name { color: var(--accent); }
[data-skin="terminal"] .role-name { text-transform: uppercase; letter-spacing: 0.08em; }
[data-skin="terminal"] .turn-user .role-name::before { content: "› "; color: var(--accent); }
[data-skin="terminal"] .turn-assistant .role-name::before { content: "$ "; color: var(--accent); }
[data-skin="editorial"] .role-name { font-family: var(--heading-font); font-style: italic; font-size: 13px; color: var(--accent); text-transform: none; letter-spacing: 0; }
[data-skin="editorial"] .role-name::before { content: "◆ "; font-style: normal; font-size: 9px; }
.model-tag { font-family: var(--mono); font-size: 10px; color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
.turn-time { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }

/* ═══ Markdown ═══ */
.md-body { line-height: 1.7; }
[data-skin="editorial"] .md-body { line-height: 1.8; font-size: 16px; }
.md-body p { margin: 0 0 10px; }
.md-body p:last-child { margin-bottom: 0; }
.md-body h1, .md-body h2 { font-family: var(--heading-font); font-size: 18px; font-weight: 700; margin: 16px 0 8px; color: var(--text); }
.md-body h3 { font-family: var(--heading-font); font-size: 15px; font-weight: 600; margin: 13px 0 5px; }
.md-body h4 { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
.md-body ul, .md-body ol { padding-left: 22px; margin: 6px 0 10px; }
.md-body li { margin: 3px 0; }
.md-body code { font-family: var(--mono); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 0.88em; }
.md-body pre { font-family: var(--mono); background: var(--code-bg); color: var(--code-text); padding: 14px 16px; overflow-x: auto; margin: 0; font-size: 13px; line-height: 1.55; }
.md-body pre code { background: none; border: none; padding: 0; color: inherit; font-size: inherit; }
.md-body strong { font-weight: 700; }
.md-body em { font-style: italic; }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.md-body blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text-dim); margin: 10px 0; }
[data-skin="editorial"] .md-body blockquote { font-style: italic; }
.md-body a { color: var(--info); text-decoration: none; border-bottom: 1px solid transparent; }
.md-body a:hover { border-bottom-color: var(--info); }
.md-body table { border-collapse: collapse; font-size: 13px; margin: 12px 0; max-width: 100%; }
.md-body th, .md-body td { border: 1px solid var(--border); padding: 6px 10px; }
.md-body th { background: var(--surface-2); font-weight: 600; }

/* 代码块卡片（语言标签 + 复制） */
.code-wrap { margin: 12px 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--code-bg); }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 10px 5px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.code-lang { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }
.code-copy { font-family: var(--mono); font-size: 10px; color: var(--text-dim); background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 1px 8px; cursor: pointer; opacity: 0.55; transition: opacity 0.15s, color 0.15s, border-color 0.15s; }
.code-wrap:hover .code-copy { opacity: 1; }
.code-copy:hover { color: var(--accent); border-color: var(--accent); }
.code-wrap pre { border: none; border-radius: 0; margin: 0; }

/* ═══ 折叠组件 ═══ */
.collapsible { margin: 10px 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.collapsible-header { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--surface-2); cursor: pointer; user-select: none; font-family: var(--mono); font-size: 12px; color: var(--text-dim); transition: background 0.15s, color 0.15s; }
.collapsible-header:hover { background: var(--accent-soft); color: var(--text); }
.collapsible-icon { font-size: 10px; color: var(--accent); transition: transform 0.2s; flex-shrink: 0; }
.collapsible.open .collapsible-icon { transform: rotate(90deg); }
.collapsible-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.collapsible-body { display: none; padding: 10px 14px; background: var(--surface); font-size: 13px; max-height: 480px; overflow-y: auto; border-top: 1px solid var(--border); }
.collapsible.open .collapsible-body { display: block; }
.collapsible-body pre { font-family: var(--mono); background: var(--code-bg); color: var(--code-text); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-size: 12px; line-height: 1.5; margin: 0; }
.tool-result { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--text-dim); font-size: 12px; max-height: 220px; overflow-y: auto; }
.tool-result-label { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
.thinking-body { white-space: pre-wrap; font-family: var(--mono); font-size: 13px; background: var(--surface-2); color: var(--text-dim); border-radius: 6px; padding: 10px; }
.tool-result-body { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--code-bg); color: var(--code-text); border-radius: 4px; padding: 8px; max-height: 180px; overflow-y: auto; }

/* ═══ recap / token ═══ */
.recap-tag { display: inline-block; font-family: var(--mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; margin: 4px 0; }
.usage-bar { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--text-faint); display: flex; flex-wrap: wrap; gap: 12px; }
.usage-item b { color: var(--text-dim); font-weight: 600; }
[data-skin="terminal"] .usage-item:not(:last-child)::after { content: "│"; color: var(--border-strong); margin-left: 12px; }

/* ═══ 加载 / 错误 / 进度 ═══ */
#loading { display: none; position: fixed; inset: 0; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font-family: var(--mono); font-size: 14px; color: var(--text-dim); }
[data-skin="terminal"] #loading-text::before { content: "▸ "; color: var(--accent); }
.spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
[data-skin="terminal"] .spinner { border-radius: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
#error-banner { display: none; font-family: var(--mono); background: var(--accent-soft); border: 1px solid var(--warn); border-radius: var(--radius); padding: 12px 16px; margin: 16px; font-size: 13px; color: var(--warn); }
#render-progress { display: none; font-family: var(--mono); font-size: 12px; color: var(--text-faint); text-align: center; padding: 10px; }

/* ═══ 单条消息复制按钮 ═══ */
.copy-btn { position: absolute; top: 6px; right: 6px; z-index: 2; font-family: var(--mono); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim); border-radius: 6px; padding: 2px 8px; font-size: 11px; line-height: 1.6; cursor: pointer; opacity: 0; transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s; }
.bubble:hover .copy-btn, .copy-btn:focus { opacity: 1; }
.copy-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
[data-skin="editorial"] .copy-btn { right: 0; }

/* ═══ 右下浮动控制簇（皮肤 + 明暗） ═══ */
#controls { position: fixed; bottom: 22px; right: 22px; z-index: 600; display: flex; flex-direction: column; gap: 10px; }
.ctrl-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-family: var(--mono); font-size: 15px; line-height: 1; cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; transition: transform 0.15s, border-color 0.2s, color 0.2s; }
.ctrl-btn:hover { transform: scale(1.08); border-color: var(--accent); color: var(--accent); }
.ctrl-btn:active { transform: scale(0.95); }
[data-skin="terminal"] .ctrl-btn { border-radius: 9px; }

/* ═══ toast ═══ */
#toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(16px); font-family: var(--mono); background: var(--surface); color: var(--text); border: 1px solid var(--accent); padding: 8px 18px; border-radius: var(--radius); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 700; box-shadow: var(--shadow); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

<script>
'use strict';

let currentData = null;

// ── 工具函数 ──────────────────────────────────────────────────────────────

function escapeHtml(str) {
  if (typeof str !== 'string') return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatTimestamp(ts) {
  if (!ts) return '';
  try {
    const d = typeof ts === 'number' ? new Date(ts * 1000) : new Date(ts);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('zh-CN', {
      month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
  } catch { return ''; }
}

function fmtNum(n) {
  if (n === undefined || n === null || n === 0) return null;
  return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
}

// ── 复制 & 提示 ────────────────────────────────────────────────────────────

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  // 回退：execCommand（适配 file:// 或旧浏览器）
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch { return false; }
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

// 给 Markdown 代码块套上「语言标签 + 复制」外壳
function enhanceCodeBlocks(root) {
  root.querySelectorAll('pre').forEach(pre => {
    if (pre.closest('.code-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    const head = document.createElement('div');
    head.className = 'code-head';
    const lang = document.createElement('span');
    lang.className = 'code-lang';
    lang.textContent = pre.getAttribute('data-lang') || 'code';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'code-copy';
    btn.textContent = 'copy';
    btn.title = '复制代码';
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const ok = await copyText(pre.innerText);
      showToast(ok ? '已复制代码' : '复制失败');
    });
    head.appendChild(lang);
    head.appendChild(btn);
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(head);
    wrap.appendChild(pre);
  });
}

// 将单个内容块转为纯文本
function blockToText(block) {
  switch (block.kind) {
    case 'text': return block.content;
    case 'code': return '```' + (block.language || '') + '\n' + block.content + '\n```';
    case 'thinking': return block.content.split('\n').map(l => '> ' + l).join('\n');
    case 'recap': return '〔' + block.content + '〕';
    case 'tool_use': {
      const summary = getToolSummary(block.name, block.input);
      return '🔧 ' + block.name + (summary ? ': ' + summary : '');
    }
  }
  return '';
}

// 将一轮对话转为纯文本（用于单条复制）
function turnToText(turn) {
  return turn.blocks.map(blockToText).filter(Boolean).join('\n\n');
}

// 将整段对话导出为 Markdown（用于复制全部）
function conversationToMarkdown(data) {
  const out = ['# ' + data.title];
  const meta = [data.metadata.source, data.metadata.model, data.metadata.date]
    .filter(Boolean).join(' · ');
  if (meta) out.push('', '> ' + meta);
  for (const turn of data.turns) {
    const who = turn.role === 'user' ? '🧑 用户' : '🤖 助手';
    const head = turn.timestamp ? who + ' · ' + turn.timestamp : who;
    out.push('', '## ' + head, '', turnToText(turn));
  }
  return out.join('\n');
}

// ── 格式检测 ──────────────────────────────────────────────────────────────

function detectFormat(content, fileName) {
  const base = fileName.split('/').pop().toLowerCase();
  const ext = base.split('.').pop();

  // Codex rollout 文件：文件名以 rollout 开头
  if (base.startsWith('rollout')) return 'codex';

  if (ext === 'json') {
    try {
      const obj = JSON.parse(content);
      if (obj && obj.mapping && obj.conversation_id) return 'chatgpt';
    } catch {}
  }

  if (ext === 'jsonl') {
    // 内容嗅探区分 codex vs claude
    const firstLine = content.trim().split('\n')[0];
    try {
      const first = JSON.parse(firstLine);
      if (first && first.payload !== undefined &&
          (first.type === 'response_item' || first.type === 'event_msg' || first.type === 'session_meta')) {
        return 'codex';
      }
      if (first && first.sessionId && first.type) return 'claude';
    } catch {}
    return 'claude';
  }

  // 兜底内容嗅探
  const firstLine = content.trim().split('\n')[0];
  try {
    const first = JSON.parse(firstLine);
    if (first && first.sessionId && first.type) return 'claude';
  } catch {}
  try {
    const obj = JSON.parse(content);
    if (obj && obj.mapping) return 'chatgpt';
  } catch {}
  throw new Error('未能识别文件格式，请选择 ChatGPT 的 .json、Claude Code 的 .jsonl 或 Codex 的 rollout*.jsonl 文件');
}

// ── 轻量 Markdown 渲染器 ──────────────────────────────────────────────────

function renderMarkdown(text) {
  if (!text) return '';
  const codes = [];

  // 1. 提取围栏代码块
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codes.length;
    codes.push({ lang: lang || '', code });
    return `\x00CODE${idx}\x00`;
  });

  // 2. 转义 HTML（在代码块提取之后）
  text = escapeHtml(text);

  // 3. 标题
  text = text.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // 4. 水平线
  text = text.replace(/^---+$/gm, '<hr>');

  // 5. 粗体 & 斜体
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
  text = text.replace(/_(.+?)_/g, '<em>$1</em>');

  // 6. 行内代码
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

  // 7. 链接
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // 8. 引用块
  text = text.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // 9. 无序列表
  text = text.replace(/((?:^[ \t]*[-*+] .+\n?)+)/gm, (block) => {
    const items = block.trim().split('\n').map(l => {
      const m = l.match(/^[ \t]*[-*+] (.+)/);
      return m ? `<li>${m[1]}</li>` : '';
    }).join('');
    return `<ul>${items}</ul>`;
  });

  // 10. 有序列表
  text = text.replace(/((?:^[ \t]*\d+\. .+\n?)+)/gm, (block) => {
    const items = block.trim().split('\n').map(l => {
      const m = l.match(/^[ \t]*\d+\. (.+)/);
      return m ? `<li>${m[1]}</li>` : '';
    }).join('');
    return `<ol>${items}</ol>`;
  });

  // 11. 表格
  text = text.replace(/((?:^\|.+\|\n?)+)/gm, (block) => {
    const rows = block.trim().split('\n');
    if (rows.length < 2) return block;
    const makeRow = (row, tag) => {
      const cells = row.split('|').filter((_, i, a) => i > 0 && i < a.length - 1);
      return '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
    };
    const header = makeRow(rows[0], 'th');
    const body = rows.slice(2).map(r => makeRow(r, 'td')).join('');
    return `<table><thead>${header}</thead><tbody>${body}</tbody></table>`;
  });

  // 12. 段落 & 换行
  const parts = text.split(/\n{2,}/);
  text = parts.map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h[1-4]|ul|ol|li|table|blockquote|hr)/.test(p)) return p;
    if (p.includes('\x00CODE')) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');

  // 13. 还原代码块
  text = text.replace(/\x00CODE(\d+)\x00/g, (_, idx) => {
    const { lang, code } = codes[+idx];
    return `<pre data-lang="${escapeHtml(lang || '')}"><code>${escapeHtml(code)}</code></pre>`;
  });

  return text;
}

// ── DOM 辅助 ─────────────────────────────────────────────────────────────

function makeCollapsible(icon, label, bodyHtml, open = false) {
  const el = document.createElement('div');
  el.className = 'collapsible' + (open ? ' open' : '');
  el.innerHTML = `
    <div class="collapsible-header">
      <span class="collapsible-icon">▶</span>
      <span style="flex-shrink:0">${escapeHtml(icon)}</span>
      <span class="collapsible-label">${escapeHtml(label)}</span>
    </div>
    <div class="collapsible-body">${bodyHtml}</div>
  `;
  el.querySelector('.collapsible-header').addEventListener('click', () => el.classList.toggle('open'));
  return el;
}

function getToolSummary(name, input) {
  if (!input) return '';
  const MAX = 90;
  let s = '';
  if (name === 'Bash') s = input.command || '';
  else if (name === 'Read') s = input.file_path || '';
  else if (name === 'Write' || name === 'Edit') s = input.file_path || '';
  else if (name === 'WebFetch' || name === 'WebSearch') s = input.url || input.query || '';
  else if (name === 'Agent') s = input.description || (input.prompt || '').slice(0, 60);
  else {
    const vals = Object.values(input).filter(v => typeof v === 'string');
    s = vals[0] || '';
  }
  return s.length > MAX ? s.slice(0, MAX) + '…' : s;
}

// ── ChatGPT 解析器 ────────────────────────────────────────────────────────

function parseChatGPT(jsonData) {
  const mapping = jsonData.mapping || {};
  const title = jsonData.title || '对话';
  const model = jsonData.default_model_slug || '';
  const date = jsonData.create_time ? formatTimestamp(jsonData.create_time) : '';

  // 找根节点（parent 为 null 或不存在的节点）
  let rootId = null;
  for (const [id, node] of Object.entries(mapping)) {
    if (!node.parent || !mapping[node.parent]) { rootId = id; break; }
  }
  if (!rootId) {
    // 回退：找 client-created-root
    rootId = Object.keys(mapping).find(id => id.includes('client-created-root') || !mapping[id].parent);
  }

  // 沿 children 链遍历（有分支取最后一个 child）
  const path = [];
  const visited = new Set();
  let cur = rootId;
  while (cur && mapping[cur] && !visited.has(cur)) {
    visited.add(cur);
    path.push(cur);
    const children = mapping[cur].children || [];
    cur = children.length ? children[children.length - 1] : null;
  }

  // 构建 turns
  const turns = [];
  let currentTurn = null;

  for (const nodeId of path) {
    const node = mapping[nodeId];
    if (!node || !node.message) continue;
    const msg = node.message;

    const role = msg.author?.role;
    const weight = msg.weight;
    const hidden = msg.metadata?.is_visually_hidden_from_conversation;
    const ct = msg.content?.content_type;

    if (weight !== 1) continue;
    if (hidden === true) continue;
    if (role !== 'user' && role !== 'assistant') continue;
    if (ct === 'model_editable_context' || ct === 'tether_browsing_display' || ct === 'multimodal_text') continue;

    const block = chatGPTBlockFromMsg(msg);
    if (!block) continue;

    if (!currentTurn || currentTurn.role !== role) {
      currentTurn = {
        role,
        timestamp: msg.create_time ? formatTimestamp(msg.create_time) : '',
        blocks: []
      };
      turns.push(currentTurn);
    }
    currentTurn.blocks.push(block);
  }

  return { title, metadata: { source: 'ChatGPT', model, date }, turns };
}

function chatGPTBlockFromMsg(msg) {
  const ct = msg.content?.content_type;

  if (ct === 'text') {
    const parts = msg.content.parts || [];
    const text = parts
      .map(p => (typeof p === 'string' ? p : (p?.text || '')))
      .join('\n')
      .trim();
    if (!text) return null;
    return { kind: 'text', content: text };
  }

  if (ct === 'thoughts') {
    const thoughts = msg.content.thoughts;
    if (!thoughts || !thoughts.length) return null;
    const t = thoughts[0];
    return { kind: 'thinking', summary: t.summary || '', content: t.content || '' };
  }

  if (ct === 'reasoning_recap') {
    const content = msg.content.content || '';
    if (!content) return null;
    return { kind: 'recap', content };
  }

  if (ct === 'code') {
    const code = msg.content.text || '';
    const lang = msg.content.language || '';
    if (!code) return null;
    return { kind: 'code', language: lang, content: code };
  }

  return null;
}

// ── Claude Code 解析器 ────────────────────────────────────────────────────

function parseClaudeCode(rawText) {
  const lines = rawText.split('\n').filter(l => l.trim());
  const records = [];
  for (const line of lines) {
    try { records.push(JSON.parse(line)); } catch {}
  }

  // 元信息
  const aiTitleRec = records.find(r => r.type === 'ai-title');
  const title = aiTitleRec?.aiTitle || 'Claude Code 会话';
  const sessionId = records[0]?.sessionId || '';

  // 第一次扫描：建立 tool_use_id → result 映射
  const toolResultMap = new Map();
  for (const rec of records) {
    if (rec.type !== 'user') continue;
    const content = rec.message?.content;
    if (!Array.isArray(content)) continue;
    for (const item of content) {
      if (item.type === 'tool_result' && item.tool_use_id) {
        let result = '';
        if (typeof item.content === 'string') result = item.content;
        else if (Array.isArray(item.content)) {
          result = item.content.map(c => (typeof c === 'string' ? c : c.text || '')).join('\n');
        }
        toolResultMap.set(item.tool_use_id, result);
      }
    }
  }

  // 第二次扫描：按 message.id 分组 assistant 记录
  const assistantGroups = new Map();
  const assistantOrder = [];
  for (const rec of records) {
    if (rec.type !== 'assistant') continue;
    const msgId = rec.message?.id;
    if (!msgId) continue;
    if (!assistantGroups.has(msgId)) {
      assistantGroups.set(msgId, []);
      assistantOrder.push(msgId);
    }
    assistantGroups.get(msgId).push(rec);
  }

  // 构建线性对话流
  const turns = [];
  const seenMsgIds = new Set();
  const seenUserUuids = new Set();

  // 使用文件顺序重建
  for (const rec of records) {
    if (rec.type === 'user') {
      if (seenUserUuids.has(rec.uuid)) continue;
      seenUserUuids.add(rec.uuid);

      const content = rec.message?.content;
      if (typeof content !== 'string') continue;
      if (rec.isMeta) continue;

      const trimmed = content.trim();
      if (!trimmed) continue;
      // 过滤系统包装消息
      if (trimmed.startsWith('<local-command') ||
          trimmed.startsWith('<command-name') ||
          trimmed.startsWith('<system-reminder')) continue;

      turns.push({
        role: 'user',
        timestamp: rec.timestamp ? formatTimestamp(rec.timestamp) : '',
        blocks: [{ kind: 'text', content: trimmed }],
        usage: null
      });
    }

    if (rec.type === 'assistant') {
      const msgId = rec.message?.id;
      if (!msgId || seenMsgIds.has(msgId)) continue;
      seenMsgIds.add(msgId);

      const groupRecs = assistantGroups.get(msgId) || [];
      const turn = buildClaudeTurn(groupRecs, toolResultMap);
      if (turn) turns.push(turn);
    }
  }

  return {
    title,
    metadata: { source: 'Claude Code', sessionId: sessionId.slice(0, 8) + '…' },
    turns
  };
}

function buildClaudeTurn(groupRecs, toolResultMap) {
  const blocks = [];
  let usage = null;
  const timestamp = groupRecs[0]?.timestamp ? formatTimestamp(groupRecs[0].timestamp) : '';
  const model = groupRecs[0]?.message?.model || '';

  for (const rec of groupRecs) {
    const u = rec.message?.usage;
    if (!usage && u && u.output_tokens) usage = u;

    const content = rec.message?.content;
    if (!Array.isArray(content)) continue;

    for (const item of content) {
      if (item.type === 'thinking') {
        // thinking 内容通常已加密（字段为空字符串）
        const body = item.thinking && item.thinking.trim()
          ? item.thinking
          : '（思考内容已加密存储）';
        blocks.push({ kind: 'thinking', summary: '', content: body });
      } else if (item.type === 'text') {
        const t = item.text?.trim();
        if (t) blocks.push({ kind: 'text', content: t });
      } else if (item.type === 'tool_use') {
        const result = toolResultMap.get(item.id) || null;
        blocks.push({ kind: 'tool_use', name: item.name || '', input: item.input || {}, result });
      }
    }
  }

  if (!blocks.length) return null;

  return {
    role: 'assistant',
    timestamp,
    model,
    blocks,
    usage: usage ? {
      input: usage.input_tokens,
      output: usage.output_tokens,
      cacheRead: usage.cache_read_input_tokens,
      cacheCreated: usage.cache_creation_input_tokens
    } : null
  };
}

// ── Codex 解析器 ──────────────────────────────────────────────────────────

function parseCodex(rawText) {
  const lines = rawText.split('\n').filter(l => l.trim());
  const records = [];
  for (const line of lines) {
    try { records.push(JSON.parse(line)); } catch {}
  }

  // 从 turn_context 提取模型名
  let model = '';
  for (const rec of records) {
    if (rec.type === 'turn_context' && rec.payload?.model) {
      model = rec.payload.model;
      break;
    }
  }

  // 过滤出 message 类型的 response_item（user / assistant）
  const msgRecords = records.filter(rec =>
    rec.type === 'response_item' &&
    rec.payload?.type === 'message' &&
    (rec.payload.role === 'user' || rec.payload.role === 'assistant')
  );

  const turns = [];
  let currentTurn = null;

  for (const rec of msgRecords) {
    const role = rec.payload.role;
    const contentArr = rec.payload.content || [];
    const phase = rec.payload.phase || '';

    // 提取文本（input_text / output_text）
    let texts = contentArr
      .filter(c => c.type === 'input_text' || c.type === 'output_text')
      .map(c => (c.text || '').trim())
      .filter(t => t);

    if (!texts.length) continue;

    // 跳过纯环境上下文的用户消息
    if (role === 'user') {
      texts = texts.filter(t => !t.startsWith('<environment_context'));
      if (!texts.length) continue;
    }

    // 构建 blocks
    const blocks = [];
    if (phase && role === 'assistant') {
      const phaseLabel = { commentary: '分析', action: '执行', plan: '规划' }[phase] || phase;
      blocks.push({ kind: 'recap', content: phaseLabel });
    }
    for (const t of texts) {
      blocks.push({ kind: 'text', content: t });
    }

    // 合并连续同角色消息
    if (!currentTurn || currentTurn.role !== role) {
      currentTurn = {
        role,
        timestamp: rec.timestamp ? formatTimestamp(rec.timestamp) : '',
        model: role === 'assistant' ? model : '',
        blocks,
        usage: null
      };
      turns.push(currentTurn);
    } else {
      currentTurn.blocks.push(...blocks);
    }
  }

  // 用第一条真实用户消息作为标题
  let title = 'Codex 会话';
  for (const turn of turns) {
    if (turn.role === 'user') {
      const tb = turn.blocks.find(b => b.kind === 'text');
      if (tb) {
        title = tb.content.replace(/\n/g, ' ').slice(0, 60);
        if (tb.content.length > 60) title += '…';
        break;
      }
    }
  }

  return {
    title,
    metadata: { source: 'Codex', model },
    turns
  };
}

// ── 渲染器 ────────────────────────────────────────────────────────────────

function renderConversation(data) {
  currentData = data;
  const container = document.getElementById('chat-container');
  const progress = document.getElementById('render-progress');
  container.innerHTML = '';
  container.appendChild(progress);

  // 头部
  document.getElementById('header-title').textContent = data.title;
  const metaParts = [data.metadata.source];
  if (data.metadata.model) metaParts.push(data.metadata.model);
  if (data.metadata.date) metaParts.push(data.metadata.date);
  if (data.metadata.sessionId) metaParts.push('session: ' + data.metadata.sessionId);
  document.getElementById('header-meta').textContent = metaParts.join(' · ');
  document.getElementById('header').style.display = 'flex';
  container.style.display = 'block';

  // 分批渲染（避免大文件卡顿）
  const BATCH = 15;
  let i = 0;

  function renderBatch() {
    const end = Math.min(i + BATCH, data.turns.length);
    for (; i < end; i++) {
      container.appendChild(buildTurnEl(data.turns[i]));
    }
    if (i < data.turns.length) {
      progress.style.display = 'block';
      progress.textContent = `渲染中… ${i} / ${data.turns.length}`;
      requestAnimationFrame(renderBatch);
    } else {
      progress.style.display = 'none';
    }
  }

  requestAnimationFrame(renderBatch);
}

function buildTurnEl(turn) {
  const wrapper = document.createElement('div');
  wrapper.className = 'turn turn-' + turn.role;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // 复制按钮（悬停显示）
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = '复制';
  copyBtn.title = '复制这条消息';
  copyBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const ok = await copyText(turnToText(turn));
    showToast(ok ? '已复制' : '复制失败');
  });
  bubble.appendChild(copyBtn);

  // 角色 / 元信息行（语义中立，由皮肤 CSS 装饰）
  const meta = document.createElement('div');
  meta.className = 'turn-meta';
  const roleName = document.createElement('span');
  roleName.className = 'role-name';
  roleName.dataset.role = turn.role;
  roleName.textContent = turn.role === 'user' ? '用户' : '助手';
  meta.appendChild(roleName);
  if (turn.model) {
    const tag = document.createElement('span');
    tag.className = 'model-tag';
    tag.textContent = turn.model;
    meta.appendChild(tag);
  }
  if (turn.timestamp) {
    const ts = document.createElement('span');
    ts.className = 'turn-time';
    ts.textContent = turn.timestamp;
    meta.appendChild(ts);
  }
  bubble.appendChild(meta);

  // 内容块
  for (const block of turn.blocks) {
    const el = buildBlockEl(block);
    if (el) bubble.appendChild(el);
  }

  // Token 用量
  if (turn.usage) {
    const bar = document.createElement('div');
    bar.className = 'usage-bar';
    const items = [
      ['输入', fmtNum(turn.usage.input)],
      ['输出', fmtNum(turn.usage.output)],
      ['缓存命中', fmtNum(turn.usage.cacheRead)],
      ['缓存写入', fmtNum(turn.usage.cacheCreated)],
    ].filter(([, v]) => v !== null);
    bar.innerHTML = items.map(([k, v]) => `<span class="usage-item"><b>${k}</b> ${v}</span>`).join('');
    bubble.appendChild(bar);
  }

  wrapper.appendChild(bubble);
  return wrapper;
}

function buildBlockEl(block) {
  if (block.kind === 'text') {
    const div = document.createElement('div');
    div.className = 'md-body';
    div.innerHTML = renderMarkdown(block.content);
    enhanceCodeBlocks(div);
    return div;
  }

  if (block.kind === 'thinking') {
    const summary = block.summary
      ? `思考过程 — ${block.summary}`
      : '思考过程';
    const bodyHtml = `<pre class="thinking-body">${escapeHtml(block.content)}</pre>`;
    return makeCollapsible('💭', summary, bodyHtml, false);
  }

  if (block.kind === 'recap') {
    const span = document.createElement('span');
    span.className = 'recap-tag';
    span.textContent = block.content;
    return span;
  }

  if (block.kind === 'code') {
    const summary = block.language
      ? `代码块（${block.language}）`
      : '代码块';
    const bodyHtml = `<pre><code>${escapeHtml(block.content)}</code></pre>`;
    return makeCollapsible('📄', summary, bodyHtml, false);
  }

  if (block.kind === 'tool_use') {
    const summary = getToolSummary(block.name, block.input);
    const label = summary ? `${block.name} — ${summary}` : block.name;

    let bodyHtml = `<pre>${escapeHtml(JSON.stringify(block.input, null, 2))}</pre>`;
    if (block.result !== null && block.result !== undefined) {
      const resultText = typeof block.result === 'string'
        ? block.result
        : JSON.stringify(block.result, null, 2);
      bodyHtml += `<div class="tool-result"><div class="tool-result-label">返回结果</div><pre class="tool-result-body">${escapeHtml(resultText.slice(0, 4000))}${resultText.length > 4000 ? '\n… (已截断)' : ''}</pre></div>`;
    }
    return makeCollapsible('🔧', label, bodyHtml, false);
  }

  return null;
}

// ── 文件处理 ──────────────────────────────────────────────────────────────

function showLoading(text) {
  const el = document.getElementById('loading');
  document.getElementById('loading-text').textContent = text || '处理中…';
  el.style.display = 'flex';
}

function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}

function showError(msg) {
  hideLoading();
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 6000);
}

function handleFile(file) {
  if (!file) return;
  document.getElementById('error-banner').style.display = 'none';
  showLoading('读取文件中…');

  const reader = new FileReader();
  reader.onload = (e) => {
    const content = e.target.result;
    try {
      const format = detectFormat(content, file.name);
      showLoading('解析对话中…');

      // 稍微延迟让 UI 刷新
      setTimeout(() => {
        try {
          let data;
          if (format === 'chatgpt') {
            data = parseChatGPT(JSON.parse(content));
          } else if (format === 'codex') {
            data = parseCodex(content);
          } else {
            data = parseClaudeCode(content);
          }

          hideLoading();
          document.getElementById('dropzone-wrapper').style.display = 'none';
          renderConversation(data);
        } catch (err) {
          showError('解析失败：' + err.message);
        }
      }, 30);
    } catch (err) {
      showError(err.message);
    }
  };
  reader.onerror = () => showError('文件读取失败');
  reader.readAsText(file, 'utf-8');
}

// ── 事件绑定 ──────────────────────────────────────────────────────────────

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', (e) => {
  handleFile(e.target.files[0]);
  e.target.value = '';
});

document.getElementById('header-reset').addEventListener('click', () => {
  document.getElementById('chat-container').style.display = 'none';
  document.getElementById('chat-container').innerHTML = '';
  document.getElementById('header').style.display = 'none';
  document.getElementById('dropzone-wrapper').style.display = 'flex';
});

// 复制整段对话
document.getElementById('header-copy').addEventListener('click', async () => {
  if (!currentData) return;
  const ok = await copyText(conversationToMarkdown(currentData));
  showToast(ok ? '已复制整段对话' : '复制失败');
});

// ── 深色模式 ──────────────────────────────────────────────────────────────
const THEME_KEY = 'ai-viewer-theme';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  btn.title = theme === 'dark' ? '切换到浅色模式' : '切换到深色模式';
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch {}
});

(function initTheme() {
  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch {}
  if (theme !== 'dark' && theme !== 'light') {
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(theme);
})();

// ── 皮肤切换：终端 / 杂志 ──────────────────────────────────────────────────
const SKIN_KEY = 'ai-viewer-skin';

function applySkin(skin) {
  document.documentElement.setAttribute('data-skin', skin);
  const btn = document.getElementById('skin-toggle');
  if (btn) {
    // 显示「将切换到」的那一套
    btn.textContent = skin === 'terminal' ? 'Aa' : '>_';
    btn.title = skin === 'terminal' ? '切换到杂志风' : '切换到终端风';
  }
}

document.getElementById('skin-toggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-skin') === 'terminal' ? 'editorial' : 'terminal';
  applySkin(next);
  try { localStorage.setItem(SKIN_KEY, next); } catch {}
});

(function initSkin() {
  let skin = null;
  try { skin = localStorage.getItem(SKIN_KEY); } catch {}
  if (skin !== 'terminal' && skin !== 'editorial') skin = 'terminal';
  applySkin(skin);
})();
</script>
